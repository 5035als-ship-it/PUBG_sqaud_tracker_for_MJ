name: Update PUBG stats

on:
  workflow_dispatch:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

concurrency:
  group: update-pubg-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Refresh PUBG data
        env:
          PUBG_API_KEY: ${{ secrets.PUBG_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HISTORY_REFRESH_HOURS: "6"
        run: node scripts/update-pubg.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/pubg-stats.json
          if git diff --cached --quiet; then
            echo "No PUBG stats changes to commit."
            exit 0
          fi
          git commit -m "Update PUBG stats"
          git push origin HEAD:main

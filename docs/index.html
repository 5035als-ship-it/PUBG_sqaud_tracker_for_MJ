<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MJ 스쿼드 전적실</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <img class="brandMark" src="https://wstatic-prod.pubg.com/web/live/main_c473c91/img/1de035e.webp" alt="PUBG BATTLEGROUNDS" />
        <p class="eyebrow">Steam PUBG Squad Tracker</p>
        <h1>MJ 스쿼드 전적실</h1>
        <p id="updatedAt">전적 데이터를 불러오는 중</p>
      </div>
      <a class="refreshLink" href="./data/pubg-stats.json">JSON</a>
    </header>

    <main>
      <section class="notice">최근 경기 상세는 PUBG API 정책상 14일까지만 조회됩니다. 빠른 갱신을 위해 현재 화면은 최근 매치 기반 통계만 보여줍니다.</section>

      <section class="summary" id="summary" aria-label="핵심 통계"></section>
      <section class="players" id="players" aria-label="플레이어 카드"></section>

      <section class="matches">
        <div class="sectionTitle">
          <h2>최근 경기</h2>
          <select id="playerFilter" aria-label="플레이어 필터">
            <option value="all">전체 플레이어</option>
          </select>
        </div>
        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>시간</th>
                <th>플레이어</th>
                <th>맵</th>
                <th>모드</th>
                <th>순위</th>
                <th>킬</th>
                <th>딜량</th>
                <th>DBNO</th>
                <th>생존</th>
              </tr>
            </thead>
            <tbody id="matchRows"></tbody>
          </table>
        </div>
      </section>

      <section class="matches">
        <div class="sectionTitle">
          <h2>같이 한 판</h2>
        </div>
        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>시간</th>
                <th>맵</th>
                <th>모드</th>
                <th>인원</th>
                <th>기록</th>
                <th>합산 킬</th>
                <th>합산 딜량</th>
                <th>시간</th>
              </tr>
            </thead>
            <tbody id="groupRows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
